version: 2
updates:
  - package-ecosystem: 'pip'
    directory: '/qlik.dev/tutorials/platform-operations/sdk-python'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: chore
    groups:
      pip-dependencies:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/qlik.dev/examples/app-sheet-list-objects'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: chore
    groups:
      npm-dependencies:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/qlik.dev/tutorials/platform-operations/sdk-typescript'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: chore
    groups:
      npm-dependencies:
        patterns:
          - '*'